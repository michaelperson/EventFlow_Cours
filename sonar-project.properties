sonar.organization=michaelperson-1
sonar.projectKey=michaelperson_EventFlow_Cours2

sonar.python.version=3.12 #juste pour éviter le warning sur la version python

#permet de bloquer lorsque le quality gate n'est pas respecté
sonar.qualitygate.wait=true

#on exclut les dossiers node_modules et qa/reports pour ne pas les analyser
sonar.exclusions=**/node_modules/**,qa/reports/**

#on exclut certains fichiers pour le coverage
sonar.coverage.exclusions =**/tests/**,**/qa/**,**/utils/factories.py,**/conftest.py

#Et les rapports ?
sonar.python.bandit.reportPaths=bandit-report.json
sonar.python.ruff.reportPaths=ruff-report.json
